apiVersion: v1
kind: ConfigMap
metadata:
  name: bilal-motors-grafana-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  bilal-motors-backend-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "title": "Backend API Request Rate",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            { "expr": "sum(rate(http_requests_total{namespace=\"default\",service=~\"backend.*\"}[5m]))", "legendFormat": "RPS" }
          ]
        },
        {
          "title": "Backend Error Rate (5xx)",
          "type": "stat",
          "datasource": "Prometheus",
          "targets": [
            { "expr": "sum(rate(http_requests_total{namespace=\"default\",service=~\"backend.*\",status=~\"5..\"}[5m]))", "legendFormat": "Errors" }
          ]
        },
        {
          "title": "Backend Memory Usage",
          "type": "gauge",
          "datasource": "Prometheus",
          "targets": [
            { "expr": "sum(container_memory_working_set_bytes{namespace=\"default\",pod=~\"backend.*\",container!=\"\"})", "legendFormat": "Bytes" }
          ]
        }
      ],
      "title": "Bilal Motors - Backend Dashboard",
      "uid": "bilal-motors-backend"
    }
  bilal-motors-frontend-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "title": "Frontend Available Replicas",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            { "expr": "max(kube_deployment_status_replicas_available{namespace=\"default\",deployment=~\"frontend.*\"})", "legendFormat": "available" }
          ]
        },
        {
          "title": "Frontend Ready Pods",
          "type": "state-timeline",
          "datasource": "Prometheus",
          "targets": [
            { "expr": "sum(kube_pod_status_ready{namespace=\"default\",pod=~\"frontend.*\",condition=\"true\"})", "legendFormat": "ready" }
          ]
        },
        {
          "title": "Frontend CPU Usage",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            { "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"default\",pod=~\"frontend.*\",container!=\"\"}[5m]))", "legendFormat": "CPU cores" }
          ]
        }
      ],
      "title": "Bilal Motors - Frontend Dashboard",
      "uid": "bilal-motors-frontend"
    }