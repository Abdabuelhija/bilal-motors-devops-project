apiVersion: v1
kind: ConfigMap
metadata:
  name: bilal-grafana-datasources
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  prometheus-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://monitoring-kube-prometheus-stack-prometheus.monitoring:9090
        isDefault: true
        editable: true
