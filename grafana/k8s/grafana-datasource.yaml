apiVersion: v1
kind: ConfigMap
metadata:
  name: bilal-motors-grafana-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://monitoring-kube-prometheus-stack-prometheus.monitoring.svc:9090
        isDefault: true
