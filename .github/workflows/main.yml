name: Bilal Motors CI/CD (Node.js)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:

        node-version: [16.x, 18.x, 20.x]
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: |
          cd back-end
          npm install

      - name: Run Lint (ESLint)
        run: |
          cd back-end
          npm run build --if-present 

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build & Push Images
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/bilal-backend:latest ./back-end
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/bilal-frontend:latest ./front-end
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/bilal-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/bilal-frontend:latest

  helm-package:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Package Helm Charts
        run: |
          mkdir -p releases
          helm package charts/back-end-chart -d releases/
          helm package charts/front-end-chart -d releases/
      - name: Upload Helm Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: helm-packages
          path: releases/*.tgz